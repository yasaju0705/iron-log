<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#090b0d">
<link rel="manifest" href="manifest.webmanifest">
<title>IRON LOG</title>
<style>
:root{--bg:#090b0d;--panel:#141a1e;--line:#2a3439;--txt:#f3f6f3;--muted:#96a19f;--lime:#b8f36b}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--txt);font-family:-apple-system,BlinkMacSystemFont,sans-serif;padding-bottom:90px}
header{padding:18px;border-bottom:1px solid var(--line);position:sticky;top:0;background:#090b0df2;z-index:4}
.brand{font-size:23px;font-weight:950;letter-spacing:2px}
.tag{font-size:9px;color:var(--muted);letter-spacing:2px}
main{max-width:760px;margin:auto;padding:17px 14px}
.title{font-size:25px;font-weight:900;margin:5px 0 18px}
.panel,.stat,.hero{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:15px;margin:12px 0}
.hero{background:linear-gradient(140deg,#192126,#111719);padding:20px}
.hero strong{display:block;color:var(--lime);font-size:34px;margin:5px 0}
.muted{color:var(--muted);font-size:12px;line-height:1.6}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:9px}
.stat b{display:block;font-size:25px;margin-top:5px}
.row{display:flex;gap:8px;align-items:flex-end}
.row>*{flex:1;min-width:0}
.row>div{display:flex;flex-direction:column}
label{display:block;font-size:12px;color:#b9c2c0;margin:10px 0 6px}
input,select{width:100%;min-height:48px;background:#090d0f;color:white;border:1px solid #344047;border-radius:10px;padding:10px;font-size:16px}
button{border:0;border-radius:11px;padding:13px;font-size:13px;font-weight:800}
.primary{background:var(--lime);color:#10160b;width:100%;margin-top:12px}
.secondary{background:#263137;color:white;border:1px solid #3b484e}
.chips{display:flex;gap:7px;overflow-x:auto;padding:4px 0 10px}
.chip{white-space:nowrap;background:#263137;color:white;border-radius:25px;padding:10px 13px}
.chip.active{background:var(--lime);color:#10160b}
.entry,.lineitem{display:flex;justify-content:space-between;gap:8px;align-items:center;padding:11px 0;border-bottom:1px solid var(--line)}
.entry:last-child,.lineitem:last-child{border:0}
.entry b{font-size:13px}
.entry small{display:block;color:var(--muted);font-size:11px;margin-top:4px}
.entry strong{font-size:12px;color:var(--lime);white-space:nowrap}
.bar{height:8px;background:#293338;border-radius:9px;overflow:hidden;flex:1}
.bar i{display:block;height:100%;background:var(--lime)}
.timer{text-align:center;font-size:40px;font-weight:900;color:var(--lime);padding:10px}
.nav{position:fixed;bottom:0;left:0;right:0;background:#111719f5;border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(5,1fr);padding:8px 3px calc(8px + env(safe-area-inset-bottom));z-index:5}
.nav button{background:none;color:#8b9695;padding:5px 1px;font-size:10px}
.nav button span{display:block;font-size:19px;margin-bottom:3px}
.nav button.active{color:var(--lime)}
.empty{font-size:12px;color:var(--muted);padding:10px 0}
.estimate{background:#20282c;padding:13px;border-radius:12px;margin-top:12px}
.estimate b{display:block;color:var(--lime);font-size:24px;margin:5px 0}
</style>
</head>
<body>
<header>
 <div class="brand">IRON LOG</div>
 <div class="tag">TRAIN HARD. TRACK SMART.</div>
</header>
<main id="app"></main>
<nav class="nav" id="nav">
 <button data-tab="home" class="active"><span>⌂</span>ホーム</button>
 <button data-tab="record"><span>＋</span>記録</button>
 <button data-tab="plans"><span>▤</span>メニュー</button>
 <button data-tab="analysis"><span>▥</span>分析</button>
 <button data-tab="body"><span>◉</span>身体管理</button>
</nav>
<script>
const $=s=>document.querySelector(s);
const today=()=>{let d=new Date();return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`};

const catalog={
 "胸":["ベンチプレス","インクラインベンチプレス","デクラインベンチプレス","ダンベルプレス","インクラインダンベルプレス","ダンベルフライ","ケーブルフライ","ペックフライ","チェストプレス","ディップス","プッシュアップ"],
 "背中":["デッドリフト","ラットプルダウン","ワイドラットプルダウン","ナロープルダウン","懸垂","シーテッドロー","ワンハンドダンベルロー","ベントオーバーロー","Tバーロー","マシンロー","ストレートアームプルダウン"],
 "肩":["ショルダープレス","ダンベルショルダープレス","サイドレイズ","ケーブルサイドレイズ","フロントレイズ","リアレイズ","リアデルトフライ","アップライトロー","フェイスプル"],
 "腕":["アームカール","ダンベルカール","ハンマーカール","プリーチャーカール","インクラインカール","トライセプスプレスダウン","オーバーヘッドエクステンション","フレンチプレス","スカルクラッシャー","ナローベンチプレス"],
 "脚":["スクワット","フロントスクワット","レッグプレス","レッグエクステンション","レッグカール","ルーマニアンデッドリフト","ブルガリアンスクワット","ランジ","カーフレイズ","ヒップスラスト"],
 "腹":["クランチ","シットアップ","レッグレイズ","アブローラー","プランク","ケーブルクランチ"],
 "その他":["ランニング","ウォーキング","バイク"]
};

const allExercises=Object.entries(catalog).flatMap(([muscle,names])=>names.map(name=>({name,muscle})));

let db;
try{
 db=JSON.parse(localStorage.getItem("ironlog-v1"))||{};
}catch(e){db={};}
db.entries=db.entries||[];
db.weights=db.weights||[];
db.plans=db.plans||{};
db.photos=db.photos||[];

let tab="home",muscle="胸",selected="ベンチプレス",rest=90,remaining=0,timer=null;

function save(){localStorage.setItem("ironlog-v1",JSON.stringify(db));}
function fmt(n){return Math.round(n).toLocaleString("ja-JP");}
function oneRM(w,r){return r>0?w*(1+r/30):0;}
function muscleOf(name){return allExercises.find(x=>x.name===name)?.muscle||"その他";}

function recoveryHTML(){
 let muscles=Object.keys(catalog).filter(m=>m!=="その他");
 let hours={"胸":72,"背中":72,"脚":72,"肩":48,"腕":48,"腹":36};
 let html=muscles.map(m=>{
  let rows=db.entries.filter(x=>x.muscle===m);
  if(!rows.length){
   return `<div class="lineitem"><span>${m}</span><b>未記録</b></div>`;
  }

  let lastDate=rows.map(x=>x.date).sort().reverse()[0];
  let lastRows=rows.filter(x=>x.date===lastDate);
  let sets=lastRows.reduce((a,x)=>a+(+x.sets||0),0);
  let recoveryHours=(hours[m]||48)*(1+Math.max(0,sets-3)*0.08);
  let days=Math.max(0,Math.floor((new Date(today()+"T00:00:00")-new Date(lastDate+"T00:00:00"))/86400000));
  let percent=Math.min(100,Math.round(days*24/recoveryHours*100));

  let status=percent>=100?"回復完了":percent>=40?"回復途中":"回復不足";
  let color=percent>=100?"#22c55e":percent>=40?"#eab308":"#ef4444";

  return `<div style="margin:14px 0">
   <div class="lineitem"><span>${m}</span><b style="color:${color}">${status} ・ ${percent}%</b></div>
   <div style="height:8px;background:var(--line);border-radius:8px;overflow:hidden">
    <div style="height:100%;width:${percent}%;background:${color};border-radius:8px"></div>
   </div>
   <small class="muted">最終トレーニング：${lastDate} ・ ${sets}セット</small>
  </div>`;
 }).join("");

 return panel("部位別コンディション",html);
}

function panel(title,content){return `<section class="panel"><h3>${title}</h3>${content}</section>`;}
function empty(t){return `<div class="empty">${t}</div>`;}
function setTab(t){tab=t;document.querySelectorAll(".nav button").forEach(b=>b.classList.toggle("active",b.dataset.tab===t));render();}
$("#nav").addEventListener("click",e=>{let b=e.target.closest("button[data-tab]");if(b)setTab(b.dataset.tab);});

function home(){
 let rows=db.entries.filter(x=>x.date===today());
 let volume=rows.reduce((a,x)=>a+x.weight*x.reps*x.sets,0);
 let sets=rows.reduce((a,x)=>a+x.sets,0);
 let muscles=[...new Set(rows.map(x=>x.muscle))];
 return `<div class="title">ホーム</div>
 <div class="hero"><div class="muted">TODAY'S VOLUME</div><strong>${fmt(volume)} <small style="font-size:13px">kg</small></strong><div class="muted">今日のトレーニング進捗</div></div>
 <div class="grid">
 <div class="stat"><div class="muted">記録種目数</div><b>${rows.length}</b></div>
 <div class="stat"><div class="muted">総セット数</div><b>${sets}</b></div>
 <div class="stat"><div class="muted">鍛えた部位</div><b>${muscles.length}</b></div>
 <div class="stat"><div class="muted">累計記録</div><b>${db.entries.length}</b></div>
 </div>
${panel("今日の記録",rows.length?todayExerciseHTML(rows):empty("まだ今日の記録はありません。"))}
 <button class="primary" onclick="setTab('record')">トレーニングを記録する</button>`;
}
function entryHTML(x){
 return `<div class="entry"><div><b>${x.exercise}</b><small>${x.date} ・ ${x.muscle}</small></div><strong>${x.weight}kg × ${x.reps}回 × ${x.sets}セット</strong></div>`;
}
function todayExerciseHTML(rows){
 let groups={};

 rows.forEach(x=>{
  if(!groups[x.exercise])groups[x.exercise]=[];
  groups[x.exercise].push(x);
 });

 return Object.entries(groups).map(([name,items])=>{
  let best=Math.max(0,...db.entries
   .filter(x=>x.exercise===name)
   .map(x=>oneRM(x.weight,x.reps)));

  return `<div class="entry">
   <div>
    <b>${name}</b>
    <small>推定1RM：${best.toFixed(1)}kg</small>
   </div>
   <div>
    ${items.map(x=>`<strong>${x.weight}kg × ${x.reps}回 × ${x.sets}セット</strong>`).join("<br>")}
   </div>
  </div>`;
 }).join("");
}
function record(){
 let names=catalog[muscle];
 let last=db.entries.filter(x=>x.exercise===selected).sort((a,b)=>b.date.localeCompare(a.date))[0];
 return `<div class="title">トレーニング記録</div>
 ${panel("① 部位を選択",`<div class="chips">${Object.keys(catalog).map(m=>`<button class="chip ${muscle===m?"active":""}" onclick="chooseMuscle('${m}')">${m}</button>`).join("")}</div>`)}
 ${panel("② 種目を選択",`<select id="exercise" onchange="selected=this.value;render()">${names.map(n=>`<option ${selected===n?"selected":""}>${n}</option>`).join("")}</select>`)}
 ${panel("③ トレーニング内容",`
<div class="row" style="gap:8px;align-items:stretch">

  <div style="flex:1.5;min-width:0">
    <label>重量（kg）</label>
    <input
      id="weight"
      type="number"
      inputmode="decimal"
      min="0"
      max="500"
      step="0.5"
      value="60"
      style="min-height:86px;height:86px;font-size:24px;text-align:center;touch-action:none"
      oninput="updateEstimate()"
      ontouchstart="startSwipe(event,'weight')"
      ontouchmove="moveSwipe(event)"
      ontouchend="endSwipe(event)"
    >
  </div>

  <div style="flex:1;min-width:0">
    <label>回数</label>
    <input
      id="reps"
      type="number"
      inputmode="numeric"
      min="1"
      max="100"
      value="10"
      style="min-height:86px;height:86px;font-size:24px;text-align:center;touch-action:none"
      oninput="updateEstimate()"
      ontouchstart="startSwipe(event,'reps')"
      ontouchmove="moveSwipe(event)"
      ontouchend="endSwipe(event)"
    >
  </div>

  <div style="flex:1;min-width:0">
    <label>セット</label>
    <input
      id="sets"
      type="number"
      inputmode="numeric"
      min="1"
      max="20"
      value="3"
      style="min-height:86px;height:86px;font-size:24px;text-align:center;touch-action:none"
      oninput="updateEstimate()"
      ontouchstart="startSwipe(event,'sets')"
      ontouchmove="moveSwipe(event)"
      ontouchend="endSwipe(event)"
    >
  </div>

</div>
 <div class="muted">${last?`前回記録：${last.weight}kg × ${last.reps}回 × ${last.sets}セット（${last.date}）`:"この種目の過去記録はありません。"}</div>
 <div class="estimate"><div class="muted">推定1RM</div><b id="estimate">80.0 kg</b><div class="muted" id="volume">総ボリューム：1,800 kg</div></div>
 <button class="primary" onclick="addEntry()">記録する</button>`)}
 ${panel("休憩タイマー",`<div class="timer" id="timer">${clock(remaining)}</div><div class="chips">${[60,90,120,180].map(n=>`<button class="chip ${rest===n?"active":""}" onclick="rest=${n};render()">${n}秒</button>`).join("")}</div><div class="row"><button class="secondary" onclick="startTimer()">開始</button><button class="secondary" onclick="pauseTimer()">停止</button><button class="secondary" onclick="resetTimer()">リセット</button></div>`)}
 ${panel("最近の記録",db.entries.slice(0,5).map(entryHTML).join("")||empty("記録はまだありません。"))}`;
}
function chooseMuscle(m){muscle=m;selected=catalog[m][0];render();}
let swipeState=null;


let swipeState=null;

function startSwipe(event,id){
 let input=$("#"+id);
 let now=Date.now();

 swipeState={
  id:id,
  startY:event.touches[0].clientY,
  lastY:event.touches[0].clientY,
  lastTime:now,
  startValue:Number(input.value)||0,
  step:id==="weight"?0.5:1,
  velocity:0,
  moved:false
 };
}

function moveSwipe(event){
 if(!swipeState)return;

 event.preventDefault();

 let now=Date.now();
 let y=event.touches[0].clientY;
 let dy=y-swipeState.lastY;
 let dt=Math.max(1,now-swipeState.lastTime);

 let speed=dy/dt;
 swipeState.velocity=swipeState.velocity*0.5+speed*0.5;
 swipeState.velocity=Math.max(-1.5,Math.min(1.5,swipeState.velocity));

 swipeState.lastY=y;
 swipeState.lastTime=now;

 let distance=y-swipeState.startY;
 let steps=Math.trunc(distance/20);

 if(steps!==0){
  swipeState.moved=true;

  let limits={
   weight:[0,500],
   reps:[1,100],
   sets:[1,20]
  };

  let value=swipeState.startValue+steps*swipeState.step;
  value=Math.min(limits[swipeState.id][1],
   Math.max(limits[swipeState.id][0],value));

  let input=$("#"+swipeState.id);
  input.value=swipeState.id==="weight"
   ? Math.round(value*2)/2
   : value;

  updateEstimate();
 }
}

function endSwipe(event){
 if(!swipeState)return;

 let state=swipeState;
 swipeState=null;

 if(state.moved){
  event.preventDefault();
  document.activeElement.blur();

  let velocity=state.velocity;
  let lastFrame=performance.now();
  let elapsed=0;
  let distance=0;
  let limits={
   weight:[0,500],
   reps:[1,100],
   sets:[1,20]
  };

  function coast(now){
   let dt=Math.min(32,now-lastFrame);
   lastFrame=now;
   elapsed+=dt;

   distance+=velocity*dt;
   let steps=Math.trunc(distance/20);

   if(steps!==0){
    distance-=steps*20;

    let input=$("#"+state.id);
    let value=Number(input.value)+steps*state.step;

    value=Math.min(limits[state.id][1],
     Math.max(limits[state.id][0],value));

    input.value=state.id==="weight"
     ? Math.round(value*2)/2
     : value;

    updateEstimate();
   }

   velocity*=Math.pow(0.90,dt/16);

   if(Math.abs(velocity)>0.025&&elapsed<900){
    requestAnimationFrame(coast);
   }
  }

  if(Math.abs(velocity)>0.025){
   requestAnimationFrame(coast);
  }
 }
}
function updateEstimate(){
 let w=+$("#weight").value,r=+$("#reps").value,s=+$("#sets").value;
 $("#estimate").textContent=oneRM(w,r).toFixed(1)+" kg";
 $("#volume").textContent="総ボリューム："+fmt(w*r*s)+" kg";
}

function addEntry(){
 let w=+$("#weight").value;
 let r=+$("#reps").value;
 let s=+$("#sets").value;

 if(!(w>0&&r>0&&s>0))
  return alert("重量・回数・セット数を正しく入力してください。");

 db.entries.unshift({
  id:Date.now().toString(),
  date:today(),
  exercise:selected,
  muscle:muscleOf(selected),
  weight:w,
  reps:r,
  sets:s
 });

 save();

 remaining=rest;
 render();

 $("#weight").value=w;
 $("#reps").value=r;
 $("#sets").value=s;

 $("#weightWheel").value=String(w);
 $("#repsWheel").value=String(r);
 $("#setsWheel").value=String(s);

 updateEstimate();

 startTimer();
}

function clock(n){return `${String(Math.floor(n/60)).padStart(2,"0")}:${String(n%60).padStart(2,"0")}`;}
function startTimer(){
 clearInterval(timer);if(!remaining)remaining=rest;
 timer=setInterval(()=>{remaining=Math.max(0,remaining-1);let el=$("#timer");if(el)el.textContent=clock(remaining);if(!remaining){clearInterval(timer);if(navigator.vibrate)navigator.vibrate([300,150,300]);}},1000);
}
function pauseTimer(){clearInterval(timer);}
function resetTimer(){pauseTimer();remaining=0;let el=$("#timer");if(el)el.textContent=clock(0);}

function plans(){
 let days=["月曜日","火曜日","水曜日","木曜日","金曜日","土曜日","日曜日"];
 return `<div class="title">トレーニングメニュー</div>${panel("週間メニュー",days.map(d=>`<label>${d}</label><input data-plan="${d}" value="${(db.plans[d]||"").replaceAll('"',"&quot;")}" placeholder="例：胸・肩・三頭">`).join("")+`<button class="primary" onclick="savePlans()">メニューを保存</button>`)}
 ${panel("登録種目",Object.entries(catalog).map(([m,names])=>`<h4>${m}</h4>${names.map(n=>`<div class="lineitem">${n}</div>`).join("")}`).join(""))}`;
}
function savePlans(){document.querySelectorAll("[data-plan]").forEach(el=>db.plans[el.dataset.plan]=el.value);save();alert("保存しました！");}


function analysis(){
 let groups={};
 db.entries.filter(x=>x.date===today()).forEach(x=>groups[x.muscle]=(groups[x.muscle]||0)+x.weight*x.reps*x.sets);
 let max=Math.max(1,...Object.values(groups));
 let names=[...new Set(db.entries.map(x=>x.exercise))];
 return `<div class="title">分析</div>
 ${panel("今日の部位別ボリューム",Object.keys(groups).length?Object.entries(groups).map(([k,v])=>`<div class="lineitem"><span>${k}</span><div class="bar"><i style="width:${v/max*100}%"></i></div><b style="color:var(--lime)">${fmt(v)}kg</b></div>`).join(""):empty("記録すると分析されます。"))}
 ${panel("種目別重量成長グラフ",names.length?`
 <label>種目を選択</label>
 <select id="growthExercise" onchange="drawWeightGraph(this.value)">
 ${names.map(n=>`<option value="${n}">${n}</option>`).join("")}
 </select>
 <div id="weightGrowthChart"></div>
 `:empty("トレーニングを記録すると重量推移が表示されます。"))}
 ${panel("種目別ベスト推定1RM",names.length?names.map(n=>{let best=Math.max(...db.entries.filter(x=>x.exercise===n).map(x=>oneRM(x.weight,x.reps)));return `<div class="lineitem"><span>${n}</span><b style="color:var(--lime)">${best.toFixed(1)}kg</b></div>`}).join(""):empty("記録はまだありません。"))}
${panel("最近の記録",db.entries.length?db.entries.map(entryHTML).join(""):empty("記録はまだありません。"))}`;
}

function drawWeightGraph(exercise){
 let el=$("#weightGrowthChart");
 if(!el)return;

 let rows=db.entries
  .filter(x=>x.exercise===exercise)
  .sort((a,b)=>a.date.localeCompare(b.date));

 if(!rows.length){
  el.innerHTML=empty("記録がありません。");
  return;
 }

 let daily={};
 rows.forEach(x=>{
  daily[x.date]=Math.max(daily[x.date]||0,x.weight);
 });

 let data=Object.entries(daily).sort((a,b)=>a[0].localeCompare(b[0]));
 let values=data.map(x=>x[1]);
 let max=Math.max(...values);
 let min=Math.min(...values);
 let range=Math.max(5,max-min);
 let top=max+range*0.2;
 let bottom=Math.max(0,min-range*0.2);
 let width=320,height=190,pad=35;
 let points=data.map((x,i)=>{
  let px=pad+(data.length===1?0:i*(width-pad*2)/(data.length-1));
  let py=height-pad-(x[1]-bottom)/(top-bottom)*(height-pad*2);
  return {x:px,y:py,date:x[0],weight:x[1]};
 });

 let line=points.map((p,i)=>(i?"L":"M")+p.x+","+p.y).join(" ");
 let circles=points.map(p=>`
  <circle cx="${p.x}" cy="${p.y}" r="4" fill="#b8f36b"/>
 `).join("");

 let labels=points.map((p,i)=>i===0||i===points.length-1||i===Math.floor(points.length/2)?`
  <text x="${p.x}" y="${height-8}" fill="#96a19f" font-size="9" text-anchor="middle">${p.date.slice(5)}</text>
 `:"").join("");

 el.innerHTML=`
  <div style="margin:12px 0;color:var(--lime);font-size:24px;font-weight:900">
   ${max} kg
  </div>
  <div style="overflow:hidden">
   <svg viewBox="0 0 ${width} ${height}" width="100%" role="img">
    <path d="${line}" fill="none" stroke="#b8f36b" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    ${circles}
    ${labels}
   </svg>
  </div>
  <div class="muted">各日付の最高重量を表示（kg）・記録日数：${data.length}日</div>
 `;
}

function body(){
 return `<div class="title">身体管理</div>
 ${recoveryHTML()}
 ${panel("体重を記録",`<label>体重 (kg)</label><input id="bodyWeight" type="number" step=".1" placeholder="例：65.0"><button class="primary" onclick="addWeight()">体重を保存</button>`)}
 ${panel("体重履歴",db.weights.slice().sort((a,b)=>b.date.localeCompare(a.date)).map(x=>`<div class="lineitem"><span>${x.date}</span><b style="color:var(--lime)">${x.weight}kg</b></div>`).join("")||empty("記録はありません。"))}
 ${panel("データのバックアップ",`<div class="muted">トレーニング記録や体重データをJSONファイルに保存できます。</div><button class="primary" onclick="exportBackup()">バックアップを書き出す</button><label>バックアップから復元</label><input id="backupFile" type="file" accept="application/json"><button class="secondary" style="width:100%;margin-top:10px" onclick="importBackup()">復元する</button>`)}`;
}
function addWeight(){let w=+$("#bodyWeight").value;if(!(w>0))return alert("体重を入力してください。");db.weights.unshift({date:today(),weight:w});save();render();}
function exportBackup(){
 let blob=new Blob([JSON.stringify({app:"IRON LOG",data:db},null,2)],{type:"application/json"});
 let url=URL.createObjectURL(blob),a=document.createElement("a");a.href=url;a.download="iron-log-backup.json";a.click();URL.revokeObjectURL(url);
}
function importBackup(){
 let file=$("#backupFile").files[0];if(!file)return alert("ファイルを選択してください。");
 if(!confirm("現在のデータを置き換えます。よろしいですか？"))return;
 let reader=new FileReader();reader.onload=()=>{try{let obj=JSON.parse(reader.result);if(obj.app!=="IRON LOG"||!obj.data.entries)throw Error();db=obj.data;save();render();alert("復元しました。");}catch(e){alert("バックアップを読み込めませんでした。");}};reader.readAsText(file);
}
function render(){
 let app=$("#app");
 app.innerHTML=({home,record,plans,analysis,body})[tab]();
 if(tab==="analysis"){
 let selector=$("#growthExercise");
 if(selector)drawWeightGraph(selector.value);
}
 if(tab==="record"){
  ["weight","reps","sets"].forEach(id=>$("#"+id).addEventListener("input",updateEstimate));
  $("#exercise").value=selected;
  updateEstimate();
 }
}
if("serviceWorker"in navigator)window.addEventListener("load",()=>navigator.serviceWorker.register("./sw.js").catch(()=>{}));
render();
</script>
</body>
</html>
