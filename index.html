<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#090b0d"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="manifest.webmanifest">
<title>IRON LOG</title>
<style>
:root{--bg:#090b0d;--panel:#141a1e;--panel2:#20282c;--line:#2a3439;--txt:#f3f6f3;--muted:#96a19f;--lime:#b8f36b;--red:#ff7777}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--txt);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;padding-bottom:calc(78px + env(safe-area-inset-bottom))}
header{padding:18px 18px 14px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;background:#090b0df2;backdrop-filter:blur(14px);z-index:4}
.brand{font-size:22px;font-weight:950;letter-spacing:2px}.tag{font-size:9px;color:var(--muted);letter-spacing:1.6px}.beta{border:1px solid var(--lime);color:var(--lime);border-radius:30px;padding:5px 10px;font-size:10px;font-weight:800}
main{max-width:760px;margin:auto;padding:18px 15px 28px}.title{font-size:25px;font-weight:850;margin:4px 0 18px}.muted{color:var(--muted);font-size:12px;line-height:1.55}.panel{background:var(--panel);border:1px solid var(--line);border-radius:17px;padding:15px;margin:12px 0}.panel h3{font-size:15px;margin:0 0 13px}.hero{background:linear-gradient(140deg,#192126,#111719);border:1px solid #2d393e;border-radius:18px;padding:20px;margin-bottom:12px}.hero strong{display:block;color:var(--lime);font-size:35px;margin:5px 0}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.stat{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px}.stat b{display:block;font-size:25px;margin-top:5px}.row{display:flex;gap:8px;align-items:center}.row>*{min-width:0;flex:1}.field{margin:9px 0}.field label{display:block;color:#b9c2c0;font-size:12px;margin-bottom:6px}input,select,textarea{width:100%;border:1px solid #344047;background:#090d0f;color:var(--txt);border-radius:10px;padding:12px;font-size:16px;min-height:44px}button{border:0;border-radius:11px;padding:13px 14px;font-size:13px;font-weight:800;cursor:pointer}.primary{background:var(--lime);color:#10160b;width:100%;margin-top:8px}.secondary{background:#263137;color:var(--txt);border:1px solid #3b484e}.danger{background:#3a2022;color:#ffb2b2}.chips{display:flex;gap:7px;overflow:auto;padding:2px 0 8px}.chip{white-space:nowrap;background:#263137;color:#dbe2de;border-radius:30px;padding:9px 12px;font-size:12px}.chip.active{background:var(--lime);color:#11170b}.entry,.lineitem{display:flex;justify-content:space-between;gap:8px;align-items:center;padding:11px 0;border-bottom:1px solid var(--line)}.entry:last-child,.lineitem:last-child{border:0}.entry b{font-size:13px}.entry small{display:block;color:var(--muted);font-size:11px;margin-top:4px}.entry strong{font-size:12px;color:var(--lime);white-space:nowrap}.estimate{background:var(--panel2);padding:13px;border-radius:12px;margin:12px 0}.estimate b{display:block;color:var(--lime);font-size:25px;margin:3px 0}.timer{text-align:center;font-size:42px;font-weight:900;color:var(--lime);padding:7px}.nav{position:fixed;bottom:0;left:0;right:0;z-index:5;background:#111719f5;border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(5,1fr);padding:8px 4px calc(7px + env(safe-area-inset-bottom));backdrop-filter:blur(16px)}.nav button{background:none;color:#8b9695;padding:5px 1px;font-size:10px}.nav button span{display:block;font-size:19px;margin-bottom:3px}.nav button.active{color:var(--lime)}.bar{height:8px;background:#293338;border-radius:9px;overflow:hidden;flex:1}.bar i{display:block;height:100%;background:var(--lime)}.photo{width:100%;max-height:260px;object-fit:cover;border-radius:12px;margin-top:8px}.empty{font-size:12px;color:var(--muted);padding:9px 0}.tiny{font-size:10px;color:var(--muted)}canvas{width:100%;height:180px;background:#0d1214;border-radius:12px}.hidden{display:none!important}
</style>
</head>
<body>
<header><div><div class="brand">IRON LOG</div><div class="tag">TRAIN HARD. TRACK SMART.</div></div><div class="beta">BETA 0.2</div></header>
<main id="app"></main>
<nav class="nav" id="nav">
<button data-tab="home" class="active"><span>⌂</span>ホーム</button><button data-tab="record"><span>＋</span>記録</button><button data-tab="plans"><span>▤</span>メニュー</button><button data-tab="analysis"><span>▥</span>分析</button><button data-tab="body"><span>◉</span>身体管理</button>
</nav>
<script>
const $=s=>document.querySelector(s), today=()=>{const d=new Date();return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`};
const defaults=[
["ベンチプレス","胸"],["インクラインダンベルプレス","胸"],["チェストプレス","胸"],["ラットプルダウン","背中"],["シーテッドロー","背中"],["ダンベルロー","背中"],["ショルダープレス","肩"],["サイドレイズ","肩"],["リアレイズ","肩"],["アームカール","腕"],["トライセプスプレスダウン","腕"],["スクワット","脚"],["レッグプレス","脚"],["レッグエクステンション","脚"]];
let db=JSON.parse(localStorage.getItem("ironlog-v1")||'{"entries":[],"weights":[],"plans":{},"photos":[]}');
let tab="home", selected=defaults[0][0], rest=90, remaining=0, timer=null;
function save(){localStorage.setItem("ironlog-v1",JSON.stringify(db))}
function fmt(n){return Number(n).toLocaleString("ja-JP")}
function oneRM(w,r){return r>0?w*(1+r/30):0}
function muscleOf(name){return defaults.find(x=>x[0]===name)?.[1]||"その他"}
function setTab(t){tab=t;document.querySelectorAll(".nav button").forEach(b=>b.classList.toggle("active",b.dataset.tab===t));render()}
$("#nav").addEventListener("click",e=>{let b=e.target.closest("button[data-tab]");if(b)setTab(b.dataset.tab)});
function panel(title,content){return `<section class="panel"><h3>${title}</h3>${content}</section>`}
function empty(t){return `<div class="empty">${t}</div>`}
function entryHTML(x){return `<div class="entry"><div><b>${x.exercise}</b><small>${x.date} ・ ${x.muscle}</small></div><strong>${x.weight}kg × ${x.reps} × ${x.sets}</strong></div>`}
function home(){let todays=db.entries.filter(x=>x.date===today()),vol=todays.reduce((a,x)=>a+x.weight*x.reps*x.sets,0);return `<div class="title">ホーム</div><div class="hero"><div class="muted">TODAY'S VOLUME</div><strong>${fmt(vol)} <small style="font-size:13px">kg</small></strong><div class="muted">${todays.length} 種目を記録</div></div><div class="grid"><div class="stat"><div class="muted">累計記録</div><b>${db.entries.length}<small> 件</small></b></div><div class="stat"><div class="muted">体重記録</div><b>${db.weights.length}<small> 件</small></b></div></div>${panel("今日のトレーニング",todays.length?todays.map(entryHTML).join(""):empty("まだ今日の記録はありません。"))}<button class="primary" onclick="setTab('record')">トレーニングを記録する</button>`}
function record(){let last=db.entries.filter(x=>x.exercise===selected).sort((a,b)=>b.date.localeCompare(a.date))[0];return `<div class="title">トレーニング記録</div>${panel("種目を選択",`<div class="chips">${defaults.map(x=>`<button class="chip ${selected===x[0]?'active':''}" onclick="selected=${JSON.stringify(x[0])};render()">${x[0]}</button>`).join("")}</div>`)}${panel("セット内容",`<div class="row"><div class="field"><label>重量 (kg)</label><input id="weight" type="number" inputmode="decimal" min="0" step=".5" value="60"></div><div class="field"><label>回数</label><input id="reps" type="number" inputmode="numeric" min="1" value="10"></div><div class="field"><label>セット</label><input id="sets" type="number" inputmode="numeric" min="1" value="3"></div></div><div class="muted">${last?`前回：${last.weight}kg × ${last.reps}回 × ${last.sets}セット（${last.date}）`:"この種目の過去記録はありません。"}</div><div class="estimate"><div class="muted">推定1RM（Epley式）</div><b id="estimate">80.0 kg</b><div class="muted" id="vol">総ボリューム：1,800 kg</div></div><button class="primary" onclick="addEntry()">記録して休憩タイマー開始</button>`)}${panel("休憩タイマー",`<div class="timer" id="timer">${clock(remaining)}</div><div class="chips">${[60,90,120,180].map(n=>`<button class="chip ${rest===n?'active':''}" onclick="rest=${n};render()">${n}秒</button>`).join("")}</div><div class="row"><button class="secondary" onclick="startTimer()">開始 / 再開</button><button class="secondary" onclick="pauseTimer()">一時停止</button><button class="secondary" onclick="resetTimer()">リセット</button></div>`)}`}
function addEntry(){let w=+$("#weight").value,r=+$("#reps").value,s=+$("#sets").value;if(!(w>0&&r>0&&s>0))return alert("重量・回数・セット数を正しく入力してください");db.entries.unshift({id:crypto.randomUUID(),date:today(),exercise:selected,muscle:muscleOf(selected),weight:w,reps:r,sets:s});save();remaining=rest;render();startTimer();alert("トレーニングを記録しました")}
function clock(n){return `${String(Math.floor(n/60)).padStart(2,"0")}:${String(n%60).padStart(2,"0")}`}
function startTimer(){clearInterval(timer);if(!remaining)remaining=rest;timer=setInterval(()=>{remaining=Math.max(0,remaining-1);let el=$("#timer");if(el)el.textContent=clock(remaining);if(!remaining){clearInterval(timer);if(navigator.vibrate)navigator.vibrate([300,150,300]);}},1000);let el=$("#timer");if(el)el.textContent=clock(remaining)}
function pauseTimer(){clearInterval(timer);timer=null}
function resetTimer(){pauseTimer();remaining=0;let el=$("#timer");if(el)el.textContent=clock(remaining)}
function plans(){let days=["月曜日","火曜日","水曜日","木曜日","金曜日","土曜日","日曜日"];return `<div class="title">トレーニングメニュー</div>${panel("週間メニュー",days.map(d=>`<div class="field"><label>${d}</label><input data-plan="${d}" placeholder="例：胸・肩・三頭" value="${(db.plans[d]||"").replaceAll('"',"&quot;")}"></div>`).join("")+`<button class="primary" onclick="savePlans()">メニューを保存</button>`)}${panel("登録種目",defaults.map(x=>`<div class="lineitem"><span>${x[0]}</span><span class="muted">${x[1]}</span></div>`).join(""))}`}
function savePlans(){document.querySelectorAll("[data-plan]").forEach(el=>db.plans[el.dataset.plan]=el.value);save();alert("週間メニューを保存しました")}
function analysis(){let todayRows=db.entries.filter(x=>x.date===today()), groups={};todayRows.forEach(x=>groups[x.muscle]=(groups[x.muscle]||0)+x.weight*x.reps*x.sets);let max=Math.max(1,...Object.values(groups));let names=[...new Set(db.entries.map(x=>x.exercise))];return `<div class="title">分析</div>${panel("今日の部位別ボリューム",Object.keys(groups).length?Object.entries(groups).map(([k,v])=>`<div class="lineitem"><span>${k}</span><div class="bar"><i style="width:${v/max*100}%"></i></div><b style="color:var(--lime);font-size:12px">${fmt(v)}kg</b></div>`).join(""):empty("記録すると部位別に集計されます。"))}${panel("種目別ベスト推定1RM",names.length?names.map(n=>{let best=Math.max(...db.entries.filter(x=>x.exercise===n).map(x=>oneRM(x.weight,x.reps)));return `<div class="lineitem"><span>${n}</span><b style="color:var(--lime)">${best.toFixed(1)}kg</b></div>`}).join(""):empty("まだ記録がありません。"))}${panel("重量推移",`<div class="field"><label>種目</label><select id="chartExercise" onchange="drawChart()">${names.map(n=>`<option>${n}</option>`).join("")}</select></div><canvas id="chart" width="650" height="230"></canvas><div class="tiny">記録した重量を日付順に表示</div>`)}`}
function drawChart(){let c=$("#chart"),sel=$("#chartExercise");if(!c||!sel)return;let rows=db.entries.filter(x=>x.exercise===sel.value).sort((a,b)=>a.date.localeCompare(b.date));let ctx=c.getContext("2d"),w=c.width,h=c.height;ctx.clearRect(0,0,w,h);ctx.strokeStyle="#344047";ctx.fillStyle="#9aa5a2";ctx.font="13px sans-serif";for(let i=0;i<4;i++){let y=20+i*(h-50)/3;ctx.beginPath();ctx.moveTo(42,y);ctx.lineTo(w-15,y);ctx.stroke()}if(!rows.length)return;let lo=Math.min(...rows.map(x=>x.weight)),hi=Math.max(...rows.map(x=>x.weight));if(lo===hi){lo=Math.max(0,lo-5);hi+=5}ctx.strokeStyle="#b8f36b";ctx.lineWidth=4;ctx.beginPath();rows.forEach((x,i)=>{let px=48+i*(w-85)/Math.max(1,rows.length-1),py=20+(hi-x.weight)*(h-55)/(hi-lo);i?ctx.lineTo(px,py):ctx.moveTo(px,py)});ctx.stroke();rows.forEach((x,i)=>{let px=48+i*(w-85)/Math.max(1,rows.length-1),py=20+(hi-x.weight)*(h-55)/(hi-lo);ctx.fillStyle="#b8f36b";ctx.beginPath();ctx.arc(px,py,5,0,Math.PI*2);ctx.fill()})}
function body(){return `<div class="title">身体管理</div>${panel("体重を記録",`<div class="field"><label>体重 (kg)</label><input id="bodyWeight" type="number" inputmode="decimal" placeholder="例：65.0" step=".1"></div><button class="primary" onclick="addWeight()">体重を保存</button>`)}${panel("体重履歴",db.weights.length?db.weights.slice().sort((a,b)=>b.date.localeCompare(a.date)).map(x=>`<div class="lineitem"><span>${x.date}</span><b style="color:var(--lime)">${x.weight.toFixed(1)}kg</b></div>`).join(""):empty("体重記録はまだありません。"))}${panel("身体写真",`<div class="muted">写真はサイズを縮小してこのiPhone内に保存します。大切な写真は定期的にバックアップしてください。</div><div class="field"><label>写真を追加</label><input id="photo" type="file" accept="image/*" capture="environment" multiple></div><button class="primary" onclick="addPhoto()">写真を保存</button><div id="photos">${db.photos.map(p=>`<div><div class="muted">${p.date}</div><img class="photo" src="${p.data}"><button class="secondary" onclick="deletePhoto('${p.id}')">削除</button></div>`).join("")}</div>`)}${panel("データのバックアップ",`<div class="muted">記録・体重・メニュー・写真をJSONファイルに書き出します。機種変更やSafariのデータ消去に備えて、定期的に保存してください。</div><button class="primary" onclick="exportBackup()">バックアップを書き出す</button><div class="field"><label>バックアップから復元</label><input id="backupFile" type="file" accept="application/json,.json"></div><button class="secondary" style="width:100%" onclick="importBackup()">バックアップを読み込む</button><div class="tiny" style="margin-top:8px">読み込みを行うと、現在のデータはバックアップ内容に置き換わります。</div>`)}`}
function addWeight(){let w=+$("#bodyWeight").value;if(!(w>0))return alert("体重を入力してください");db.weights.unshift({id:crypto.randomUUID(),date:today(),weight:w});save();render()}
function addPhoto(){let files=$("#photo").files;if(!files.length)return alert("写真を選択してください");[...files].forEach(file=>{let reader=new FileReader();reader.onload=()=>{let img=new Image();img.onload=()=>{let scale=Math.min(1,1280/Math.max(img.width,img.height)),canvas=document.createElement("canvas");canvas.width=Math.round(img.width*scale);canvas.height=Math.round(img.height*scale);canvas.getContext("2d").drawImage(img,0,0,canvas.width,canvas.height);db.photos.unshift({id:crypto.randomUUID(),date:today(),data:canvas.toDataURL("image/jpeg",.78)});try{save();render()}catch(e){alert("保存容量が不足しています。不要な写真を削除するか、バックアップ後に写真を整理してください。")}};img.src=reader.result};reader.readAsDataURL(file)})}
function exportBackup(){let payload={app:"IRON LOG",version:2,exportedAt:new Date().toISOString(),data:db};let blob=new Blob([JSON.stringify(payload,null,2)],{type:"application/json"}),url=URL.createObjectURL(blob),a=document.createElement("a");a.href=url;a.download=`iron-log-backup-${today()}.json`;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1500)}
function importBackup(){let file=$("#backupFile").files[0];if(!file)return alert("バックアップファイルを選択してください");if(!confirm("現在の記録をバックアップ内容に置き換えます。続けますか？"))return;let reader=new FileReader();reader.onload=()=>{try{let obj=JSON.parse(reader.result),d=obj.data;if(obj.app!=="IRON LOG"||!d||!Array.isArray(d.entries)||!Array.isArray(d.weights)||!Array.isArray(d.photos)||typeof d.plans!=="object")throw new Error("invalid");db={entries:d.entries,weights:d.weights,photos:d.photos,plans:d.plans};save();alert("バックアップを復元しました。");render()}catch(e){alert("このファイルはIRON LOGのバックアップとして読み込めませんでした。")}};reader.readAsText(file)}
function deletePhoto(id){if(confirm("この写真を削除しますか？")){db.photos=db.photos.filter(x=>x.id!==id);save();render()}}
function render(){let app=$("#app");app.innerHTML=({home,record,plans,analysis,body})[tab]();if(tab==="analysis")drawChart();if(tab==="record"){["weight","reps","sets"].forEach(id=>$("#"+id).addEventListener("input",()=>{let w=+$("#weight").value,r=+$("#reps").value,s=+$("#sets").value;$("#estimate").textContent=oneRM(w,r).toFixed(1)+" kg";$("#vol").textContent="総ボリューム："+fmt(w*r*s)+" kg"}))}}
if("serviceWorker"in navigator)window.addEventListener("load",()=>navigator.serviceWorker.register("./sw.js").catch(()=>{}));
render();
</script>
</body></html>
